name: Publish to JSR

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.x"

      - name: Type check
        run: deno check mod.ts

      - name: Cache dependencies
        run: deno cache deps.ts

      - name: Publish to JSR
        run: npx jsr publish --allow-slow-types
